name: test
on:
  push:
    branches:
    - "**"
  pull_request:
    branches:
    - main
  schedule:
  # weekly, to notice newly known vulnerabilities
  - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - run: go vet ./...
    - run: go test ./...
  govulncheck:
    runs-on: ubuntu-latest
    steps:
    - uses: golang/govulncheck-action@v1
      with:
        go-version-file: go.mod
  goreleaser:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - uses: goreleaser/goreleaser-action@v7
      with:
        distribution: goreleaser
        version: "~> v2"
        args: release --snapshot --clean --skip=docker,publish
  test-action:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - version: latest
        - version: 0.3.11
        - version: 0.4.0
          next-release: major
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - id: git-describe-semver
      uses: ./
      with:
        version: ${{ matrix.version }}
        dir: .
        fallback: v0.0.0-init
        drop-prefix: true
        prerelease-prefix: prefix
        prerelease-suffix: suffix
        prerelease-timestamped: true
        next-release: ${{ matrix.next-release }}
    - name: Verify output
      env:
        VERSION: ${{ steps.git-describe-semver.outputs.version }}
      run: |
        if [[ -z "$VERSION" ]]; then
          echo Output version is empty!
          exit 1
        fi
