name: 'Git describe semver'
description: ''
inputs:
  version:
    description: 'Which git-describe-semver release should be used?'
    default: 'latest'
  dir:
    description: 'Git worktree directory (defaults to current directory)'
    default: '.'
  fallback:
    description: 'Fallback to given tag name if no tag is available'
    default: 'v0.0.0'
  drop-prefix:
    description: 'Drop any present prefix (like "v") from the output'
    default: 'false'
  prerelease-prefix:
    description: 'Adds a dash-separated prefix to the prerelease part'
    default: 'dev'
  prerelease-suffix:
    description: 'Adds a dash-separated suffix to the prerelease part'
    default: ''
  prerelease-timestamped:
    description: 'Use timestamp instead of commit count for prerelease'
    default: 'false'
  next-release:
    description: 'Bump current version to next release (choices: "major", "minor", "patch")'
    default: ''
  github-token:
    description: 'Token to query the GitHub API for the latest release (avoids rate limits)'
    default: ${{ github.token }}
outputs:
  version:
    description: 'Version output from git-describe-semver'
    value: ${{ steps.git-describe-semver.outputs.version }}
runs:
  using: 'composite'
  steps:
    - run: |
        set -euo pipefail
        REPO="choffmeister/git-describe-semver"
        if [[ "$INPUT_VERSION" == "latest" ]]; then
          AUTH=()
          if [[ -n "${GITHUB_TOKEN:-}" ]]; then AUTH=(-H "Authorization: Bearer $GITHUB_TOKEN"); fi
          TAG="$(curl -fsSL "${AUTH[@]}" "https://api.github.com/repos/$REPO/releases/latest" | jq -r .tag_name)"
        else
          TAG="v${INPUT_VERSION#v}"
        fi
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]*)?$ ]]; then
          echo "Invalid version: $TAG" >&2
          exit 1
        fi
        ARCHIVE="git-describe-semver_${TAG#v}_linux_amd64.tar.gz"
        TMP="$(mktemp -d)"
        cd "$TMP"
        curl -fsSLO "https://github.com/$REPO/releases/download/$TAG/$ARCHIVE"
        curl -fsSLO "https://github.com/$REPO/releases/download/$TAG/checksums.txt"
        grep " $ARCHIVE\$" checksums.txt | sha256sum -c -
        tar xzf "$ARCHIVE" git-describe-semver
        mv git-describe-semver /usr/local/bin
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
    - id: git-describe-semver
      run: |
        set -euo pipefail
        ARGS=(
          --dir="$INPUT_DIR"
          --fallback="$INPUT_FALLBACK"
          --prerelease-prefix="$INPUT_PRERELEASE_PREFIX"
          --prerelease-suffix="$INPUT_PRERELEASE_SUFFIX"
          --format="version=<version>"
        )
        if [[ "$INPUT_DROP_PREFIX" == "true" ]]; then ARGS+=(--drop-prefix); fi
        if [[ "$INPUT_PRERELEASE_TIMESTAMPED" == "true" ]]; then ARGS+=(--prerelease-timestamped); fi
        if [[ -n "$INPUT_NEXT_RELEASE" ]]; then ARGS+=(--next-release="$INPUT_NEXT_RELEASE"); fi
        git-describe-semver "${ARGS[@]}" "$GITHUB_OUTPUT"
      shell: bash
      env:
        INPUT_DIR: ${{ inputs.dir }}
        INPUT_FALLBACK: ${{ inputs.fallback }}
        INPUT_DROP_PREFIX: ${{ inputs.drop-prefix }}
        INPUT_PRERELEASE_PREFIX: ${{ inputs.prerelease-prefix }}
        INPUT_PRERELEASE_SUFFIX: ${{ inputs.prerelease-suffix }}
        INPUT_PRERELEASE_TIMESTAMPED: ${{ inputs.prerelease-timestamped }}
        INPUT_NEXT_RELEASE: ${{ inputs.next-release }}
    - run: echo "$VERSION"
      shell: bash
      env:
        VERSION: ${{ steps.git-describe-semver.outputs.version }}
